name: Synchro Instagram → page News

on:
  schedule:
    - cron: "17 5 * * *"      # tous les jours vers 6h-7h (heure de Paris)
  workflow_dispatch:          # bouton « Run workflow » pour lancer à la main
  push:
    paths:
      - "data/details-projets.json"   # relance quand tu ajoutes des détails techniques

permissions:
  contents: write

concurrency:
  group: instagram-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer Pillow (redimensionnement des images)
        run: pip install --quiet pillow

      - name: Récupérer les posts et générer news.html
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: "17841424357554228"
          IG_MAX_POSTS: "24"
        run: |
          if [ "$(date -u +%u)" = "1" ]; then export IG_REFRESH=1; fi
          python scripts/instagram_sync.py

      - name: Publier les changements
        run: |
          git config user.name "Synchro Instagram"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.html images/instagram data
          if git diff --cached --quiet; then
            echo "Rien de nouveau"
          else
            git commit -m "News : synchronisation Instagram"
            git push
          fi
